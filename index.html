<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Demo</title>
    <style>
        body {font-family: Arial; margin: 20px;}
        table, th, td {border: 1px solid black; border-collapse: collapse; padding: 5px;}
    </style>
</head>
<body>

<header>
    <h1>Welcome to HTML</h1>
    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a>
    </nav>
</header>

<section>
    <h2>Text Formatting</h2>
    <p>This is <b>bold</b>, <i>italic</i>, <u>underlined</u>, <mark>highlighted</mark>, and <strong>important</strong> text.</p>
</section>

<section>
    <h2>Lists</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
        <li>c++</li>
    </ul>

    <ol>
        <li>Learn</li>
        <li>Practice</li>
        <li>Build</li>
    </ol>
</section>

<section>
    <h2>Image</h2>
    <img src="https://google.com" alt="Sample Image">
</section>

<section>
    <h2>Table</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>John</td>
            <td>20</td>
        </tr>
    </table>
</section>

<section>
    <h2>Form</h2>
    <form>
        Name: <input type="text"><br><br>
        Email: <input type="email"><br><br>
        <button>Submit</button>
    </form>
</section>

<footer>
    <p>&copy; 2026 HTML Demo</p>
</footer>

</body>
</html>
